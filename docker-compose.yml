name: edupath

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: edupath
      POSTGRES_USER: edupath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edupath}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edupath -d edupath"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      Database__Provider: Postgres
      Database__MigrateOnStartup: "true"
      Database__SeedDemoData: "true"
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=edupath;Username=edupath;Password=${POSTGRES_PASSWORD:-edupath}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-edupath-docker-signing-key-change-me-0123456789}
      Cors__Origins__0: http://localhost:8080
    volumes:
      - api-files:/app/App_Data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\r\n\r\n\" >&3 && grep -q Healthy <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  db-data:
  api-files:
